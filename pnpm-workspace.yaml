# 依存の install script を走らせてよいものの明示。
# pnpm は既定で全部止める(取ってきたパッケージが任意のコードを install 時に走らせるため)。
# package.json の `pnpm` フィールドは pnpm 11 から読まれない — 設定はここだけに置く。
#
# `bun` だけ true。**走らせる側の実体**なので、script が走らないと
# `Bun's postinstall script was not run` で起動もできない。
# **書かないと install が対話待ちになる** — コンテナの中では止まったまま返ってこない。
allowBuilds:
  bun: true
